name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Find project folder
        id: find
        run: |
          f=$(find . -name 'settings.gradle*' | head -n 1)
          if [ -z "$f" ]; then
            echo "Khong tim thay settings.gradle. Hay tai noi dung du an len, khong tai file ZIP."
            exit 1
          fi
          echo "dir=$(dirname "$f")" >> "$GITHUB_OUTPUT"

      - name: Check Gradle wrapper
        id: wrapper
        working-directory: ${{ steps.find.outputs.dir }}
        run: |
          if [ -f gradlew ]; then
            echo "has=true" >> "$GITHUB_OUTPUT"
          else
            echo "has=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Gradle (only if project has no wrapper)
        if: steps.wrapper.outputs.has == 'false'
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Build debug APK (wrapper)
        if: steps.wrapper.outputs.has == 'true'
        working-directory: ${{ steps.find.outputs.dir }}
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Build debug APK (installed Gradle)
        if: steps.wrapper.outputs.has == 'false'
        working-directory: ${{ steps.find.outputs.dir }}
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: ${{ steps.find.outputs.dir }}/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
